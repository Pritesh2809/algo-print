<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALGORHYTHM'26 Participants</title>

<style>
:root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --border:#e5e7eb;
    --primary:#2563eb;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:var(--bg);
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:10px;
}

h2{
    color:#111827;
}

button{
    background:var(--primary);
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

button:hover{
    opacity:.9;
}

.table-wrap{
    overflow:auto;
    max-height:700px;
    border:1px solid var(--border);
    border-radius:10px;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#f9fafb;
    position:sticky;
    top:0;
}

th,td{
    padding:12px;
    border-bottom:1px solid var(--border);
    text-align:left;
}

tbody tr:hover{
    background:#f3f4f6;
}

#syncStatus{
    margin-top:5px;
    color:#6b7280;
    font-size:12px;
}

.total{
    margin-top:10px;
    font-weight:bold;
    color:#2563eb;
}
</style>
</head>

<body>

<div class="container">
    <div class="card">

        <div class="header">
            <div>
                <h2>ALGORHYTHM'26 Participant List</h2>
                <div id="syncStatus">Loading data...</div>
                <div class="total">
                    Total Participants:
                    <span id="totalParticipants">0</span>
                </div>
            </div>

            <button onclick="downloadExcel()">
                Download Excel
            </button>
        </div>

        <div class="table-wrap">
            <table id="participantTable">
                <thead>
                <tr>
                    <th>S.No</th>
                    <th>Name</th>
                    <th>Year</th>
                    <th>College</th>
                    <th>Mail-id</th>
                </tr>
                </thead>

                <tbody id="tableBody"></tbody>
            </table>
        </div>

    </div>
</div>

<script>

// ================= GOOGLE SHEETS =================

const SHEETS = [
{
    id:"1I5r5Zy69lSOB3-0_kjm94Twe20zfU_Xz3oLbmRmXe7A",
    name:"Form Responses 1"
},
{
    id:"1QssSb2v6UH1XcNxaBYEBZmGDQKrqH78TtXdm5A8rTa0",
    name:"Form Responses 1"
}
];

let participants = [];

// ================= FETCH DATA =================

async function fetchData(){

    try{

        let allRows = [];

        for(const sheet of SHEETS){

            const url =
            `https://docs.google.com/spreadsheets/d/${sheet.id}/gviz/tq?sheet=${encodeURIComponent(sheet.name)}&t=${Date.now()}`;

            const response = await fetch(url);

            const text = await response.text();

            const json = JSON.parse(
                text.match(/setResponse\(([\s\S]+)\);/)[1]
            );

            allRows.push(...json.table.rows);
        }

        processData(allRows);

        document.getElementById("syncStatus").innerText =
        "Last Synced : " + new Date().toLocaleString();

    }
    catch(error){

        console.error(error);

        document.getElementById("syncStatus").innerText =
        "Unable to fetch data";
    }
}

// ================= PROCESS DATA =================

function processData(rows){

    const uniqueUsers = new Map();

    rows.forEach(row => {

        const name =
            row.c?.[2]?.v || "";

        const email =
            (row.c?.[3]?.v || "")
            .toString()
            .trim()
            .toLowerCase();

        const college =
            row.c?.[7]?.v || "";

        // CHANGE INDEX IF YEAR COLUMN IS DIFFERENT
        const year =
            row.c?.[8]?.v || "";

        if(!email) return;

        if(!uniqueUsers.has(email)){

            uniqueUsers.set(email,{
                name,
                year,
                college,
                email
            });
        }

    });

    participants = [...uniqueUsers.values()];

    document.getElementById("totalParticipants").innerText =
    participants.length;

    renderTable();
}

// ================= RENDER TABLE =================

function renderTable(){

    const tbody =
    document.getElementById("tableBody");

    tbody.innerHTML =
    participants.map((p,index)=>`

        <tr>
            <td>${index + 1}</td>
            <td>${p.name}</td>
            <td>${p.year}</td>
            <td>${p.college}</td>
            <td>${p.email}</td>
        </tr>

    `).join("");
}

// ================= DOWNLOAD EXCEL =================

function downloadExcel(){

    let csv =
    "S.No,Name,Year,College,Mail-id\n";

    participants.forEach((p,index)=>{

        csv +=
        `${index + 1},"${p.name}","${p.year}","${p.college}","${p.email}"\n`;

    });

    const blob =
    new Blob([csv],{
        type:"text/csv;charset=utf-8;"
    });

    const link =
    document.createElement("a");

    const url =
    URL.createObjectURL(blob);

    link.href = url;
    link.download =
    "Algorhythm_Participants.csv";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);
}

// ================= START =================

fetchData();

</script>

</body>
</html>
