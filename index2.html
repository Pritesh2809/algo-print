<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALGORHYTHM'26 Participant List</title>

<style>
:root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --border:#e5e7eb;
    --primary:#2563eb;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:var(--bg);
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

h2{
    color:#111827;
}

button{
    background:var(--primary);
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

button:hover{
    opacity:.9;
}

.table-wrap{
    overflow:auto;
    max-height:700px;
    border:1px solid var(--border);
    border-radius:10px;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#f9fafb;
    position:sticky;
    top:0;
}

th,td{
    padding:12px;
    border-bottom:1px solid var(--border);
    text-align:left;
}

tbody tr:hover{
    background:#f3f4f6;
}

#syncStatus{
    margin-top:15px;
    color:#6b7280;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">
            <div>
                <h2>ALGORHYTHM'26 Participants</h2>
                <p id="syncStatus">Loading...</p>
            </div>

            <button onclick="downloadExcel()">
                Download Excel
            </button>
        </div>

        <div class="table-wrap">
            <table id="participantTable">
                <thead>
                <tr>
                    <th>S.No</th>
                    <th>Name</th>
                    <th>College</th>
                    <th>Mail-id</th>
                </tr>
                </thead>

                <tbody id="tableBody">
                </tbody>
            </table>
        </div>

    </div>

</div>

<script>

/* GOOGLE SHEETS */
const SHEETS = [
{
id:"1I5r5Zy69lSOB3-0_kjm94Twe20zfU_Xz3oLbmRmXe7A",
name:"Form Responses 1"
},
{
id:"1QssSb2v6UH1XcNxaBYEBZmGDQKrqH78TtXdm5A8rTa0",
name:"Form Responses 1"
}
];

let participants=[];

async function fetchData(){

    try{

        let allRows=[];

        for(const sheet of SHEETS){

            const url =
            `https://docs.google.com/spreadsheets/d/${sheet.id}/gviz/tq?sheet=${encodeURIComponent(sheet.name)}&t=${Date.now()}`;

            const response = await fetch(url);
            const text = await response.text();

            const json = JSON.parse(
                text.match(/setResponse\(([\s\S]+)\);/)[1]
            );

            allRows.push(...json.table.rows);
        }

        processData(allRows);

        document.getElementById("syncStatus").innerText =
        `Last Sync : ${new Date().toLocaleString()}`;

    }
    catch(error){

        console.error(error);

        document.getElementById("syncStatus").innerText =
        "Failed to load data";
    }
}

function processData(rows){

    const uniqueUsers = new Map();

    rows.forEach(row=>{

        const name =
            row.c?.[2]?.v || "";

        const email =
            (row.c?.[3]?.v || "")
            .toString()
            .trim()
            .toLowerCase();

        const college =
            row.c?.[7]?.v || "";

        if(!email) return;

        if(!uniqueUsers.has(email)){

            uniqueUsers.set(email,{
                name,
                college,
                email
            });
        }
    });

    participants=[...uniqueUsers.values()];

    renderTable();
}

function renderTable(){

    const tbody =
    document.getElementById("tableBody");

    tbody.innerHTML =
    participants.map((p,index)=>`

        <tr>
            <td>${index+1}</td>
            <td>${p.name}</td>
            <td>${p.college}</td>
            <td>${p.email}</td>
        </tr>

    `).join("");
}

/* DOWNLOAD CSV / EXCEL */
function downloadExcel(){

    let csv =
    "S.No,Name,College,Mail-id\n";

    participants.forEach((p,index)=>{

        csv +=
        `${index+1},"${p.name}","${p.college}","${p.email}"\n`;
    });

    const blob =
    new Blob([csv],{type:"text/csv"});

    const url =
    window.URL.createObjectURL(blob);

    const a =
    document.createElement("a");

    a.href = url;
    a.download =
    "Algorhythm_Participants.csv";

    a.click();

    window.URL.revokeObjectURL(url);
}

fetchData();

</script>

</body>
</html>
